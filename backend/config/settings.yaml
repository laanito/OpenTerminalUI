app:
  name: "OpenTerminalUI API"
  environment: "local"
  default_exchange_suffix: ".NS"
  # OpenAI-compatible LLM endpoint for news sentiment, emotion & insights.
  # Defaults to a local Ollama server; works with LM Studio, OpenAI, OpenRouter,
  # etc. by overriding llm_base_url / llm_model / llm_api_key (env or here).
  llm_base_url: "http://localhost:11434/v1"
  llm_model: "llama3.1"
  llm_enabled: true
  llm_timeout_seconds: 240.0
  llm_structured_output: "auto"  # auto | json_schema | json | none
  # v2.4 foundation (application call sites opt in in later slices).
  # llm_deep_model: "your-deep-model"
  # llm_deep_base_url: "http://localhost:1234/v1"  # explicit URL never inherits Fast key
  # llm_deep_api_key: ""  # configure host credentials via environment, not this file
  # llm_deep_timeout_seconds: 600
  # llm_deep_structured_output: "auto"

data_sources:
  market_data:
    provider: "yfinance"
    fallback_providers:
      - "alpha_vantage"
      - "polygon"
  macro_data:
    provider: "fred"

storage:
  raw_path: "data/raw"
  processed_path: "data/processed"
  cache_path: "data/cache"
