name: CI

# A clean Compose install, backend/frontend integrity, and a deterministic
# Chromium browser smoke set gate every PR and push to main. The broader legacy
# Playwright journeys remain available for manual rehabilitation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and boot fresh Docker Compose stack
        run: sh scripts/verify_clean_install.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python compileall
        run: python -m compileall backend

      - name: Mock-detection guard (no fabricated data in production)
        run: python scripts/check_no_production_mocks.py

      - name: Surface inventory guard (all API families classified)
        run: PYTHONPATH=. python scripts/check_surface_inventory.py

      - name: Generated API reference guard
        run: PYTHONPATH=. python scripts/generate_api_reference.py --check

      - name: Run pytest with coverage
        run: PYTHONPATH=. pytest backend/tests -q --cov=backend --cov-fail-under=45 --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: |
            pytest-report.xml
            coverage.xml

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Frontend unit tests (Vitest)
        run: |
          cd frontend
          npx vitest run 2>&1 | tee vitest.log || true
          # Fail on actual test failures (✗ or FAIL markers)
          if grep -qE '^\s*[×✗]|FAIL\s' vitest.log; then
            echo "::error::Vitest tests had failures"
            exit 1
          fi
          # Ensure tests actually ran
          if ! grep -q '✓' vitest.log; then
            echo "::error::No passing tests found — vitest may not have run"
            exit 1
          fi
          echo "All Vitest tests passed"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Playwright critical smoke tests
        run: |
          npm run test:e2e:smoke --prefix frontend

      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            const m = xml.match(/line-rate=\"([0-9.]+)\"/);
            const pct = m ? (Number(m[1]) * 100).toFixed(2) : 'unknown';
            const body = `Backend coverage: **${pct}%** (threshold: 45%)`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.3-pg16-trixie
        env:
          POSTGRES_DB: openterminalui_ci
          POSTGRES_USER: openterminalui_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openterminalui_ci -d openterminalui_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Migrate disposable PostgreSQL database
        run: PYTHONPATH=. alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql://openterminalui_ci:ci-only-password@127.0.0.1:5432/openterminalui_ci

      - name: Run PostgreSQL ownership and ingestion contracts
        run: >-
          PYTHONPATH=. pytest
          backend/tests/test_postgres_contract.py
          backend/tests/test_portfolio_primary.py
          backend/tests/test_external_note_ingest.py
          -q
        env:
          OPENTERMINALUI_ALLOW_POSTGRES_TESTS: "1"
          OPENTERMINALUI_TEST_DATABASE_URL: postgresql+asyncpg://openterminalui_ci:ci-only-password@127.0.0.1:5432/openterminalui_ci
